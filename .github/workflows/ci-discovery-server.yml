name: CI - discovery-server

on:
  push:
    branches: [develop, master]
    paths:
      - 'services/discovery-server/**'
      - 'common-lib/**'
      - 'pom.xml'
      - '.github/workflows/ci-discovery-server.yml'
  pull_request:
    paths:
      - 'services/discovery-server/**'
      - 'common-lib/**'
      - 'pom.xml'
      - '.github/workflows/ci-discovery-server.yml'

jobs:
  common-lib:
    uses: ./.github/workflows/ci-common-lib.yml

  build:
    needs: common-lib
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test discovery-server
        run: ./mvnw -B -pl services/discovery-server -am test
