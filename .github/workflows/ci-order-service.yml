name: CI - order-service

on:
  push:
    branches: [develop, master]
    paths:
      - 'services/order-service/**'
      - 'common-lib/**'
      - 'pom.xml'
      - '.github/workflows/ci-order-service.yml'
  pull_request:
    paths:
      - 'services/order-service/**'
      - 'common-lib/**'
      - 'pom.xml'
      - '.github/workflows/ci-order-service.yml'

jobs:
  common-lib:
    uses: ./.github/workflows/ci-common-lib.yml

  build:
    needs: common-lib
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # order-service's ProductClientContractTest/CustomerClientContractTest (feature/contract-testing)
      # consume catalog-service's/customer-service's stub jars via spring-cloud-contract-stub-runner
      # in LOCAL mode, resolved from this runner's own local Maven repository. This tutorial has no
      # remote Nexus/Artifactory publishing those jars, so this job builds and installs them itself
      # first. Tests are skipped here: each producer's own CI job (ci-catalog-service.yml,
      # ci-customer-service.yml) already runs its contract-verification test against its real
      # controller, re-running it again from a consumer's pipeline would be redundant.
      #
      # Two separate invocations, not one "-pl services/catalog-service,services/customer-service"
      # call: every other CI job in this repo builds exactly one service per mvn invocation, and
      # combining two sibling modules in a single -pl list is a pattern this repo's CI had never
      # exercised before this branch. That combined form reproducibly triggered a Maven plugin
      # classloader conflict on this project's GitHub Actions runner specifically (a
      # ClassCastException between two different copies of org.apache.httpcomponents:httpclient
      # classes, loaded into two different plugin ClassRealms), never reproducible locally under
      # any tested configuration, including a genuinely fresh, isolated local repository. Splitting
      # back into the repo's established one-module-per-invocation pattern avoids it.
      - name: Install catalog-service contract stub
        run: mvn -B -pl services/catalog-service -am install -DskipTests

      - name: Install customer-service contract stub
        run: mvn -B -pl services/customer-service -am install -DskipTests

      - name: Build and test order-service
        run: mvn -B -pl services/order-service -am test
