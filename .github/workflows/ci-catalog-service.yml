name: CI - catalog-service

on:
  push:
    branches: [develop, master]
    paths:
      - 'services/catalog-service/**'
      - 'common-lib/**'
      - 'pom.xml'
      - '.github/workflows/ci-catalog-service.yml'
  pull_request:
    paths:
      - 'services/catalog-service/**'
      - 'common-lib/**'
      - 'pom.xml'
      - '.github/workflows/ci-catalog-service.yml'

jobs:
  common-lib:
    uses: ./.github/workflows/ci-common-lib.yml

  build:
    needs: common-lib
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test catalog-service
        run: mvn -B -pl services/catalog-service -am test
