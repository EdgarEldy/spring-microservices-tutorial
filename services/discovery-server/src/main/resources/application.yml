spring:
  application:
    name: discovery-server

server:
  port: 8761

eureka:
  client:
    # A standalone Eureka server has no peer to register with or fetch a registry from.
    register-with-eureka: false
    fetch-registry: false

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState
        liveness:
          include: livenessState
