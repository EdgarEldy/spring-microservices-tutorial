# Test profile: disables remote config import so customer-service's tests
# (unit/integration) never depend on a config-server actually running. Tests
# supply their own config (via @TestPropertySource, this file itself, or
# Testcontainers later).
spring:
  config:
    import: ""

# jwt.secret is duplicated here on purpose. config-repo's customer-service-test.yml
# (added later, in feature/infrastructure's config-repo, once this service has one)
# would also define it, but spring.config.import is blank above, so that remote file
# is never fetched by anything running with the "test" profile: this local file is
# the one that actually reaches the tests. JwtService requires this property with no
# default (@Value("${jwt.secret}")), so without this block every test that loads a
# Spring context touching JwtService would fail at context startup.
jwt:
  secret: test-only-jwt-secret-not-for-any-real-use-0123456789-customer-service
