# Dev profile: local execution outside Docker Compose, against the shared
# "postgres_main" Postgres container already running on this machine
# (superuser credentials admin/admin, port 5432 published on the host).
# auth_db was created manually in it.
#
# Flyway/ddl-auto=validate/open-in-view now live in the neutral auth-service.yml
# (common to every profile), no need to repeat them here: JPA entities,
# repositories, and V1__init_schema.sql all exist now.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: admin
    password: admin
  jpa:
    show-sql: true
  kafka:
    # No real Kafka container in docker-compose.yml at this stage of the
    # project: it's only added in feature/notification-service (see README,
    # "Order of work"). localhost:9092 assumes a Kafka broker started by hand
    # locally (or none at all); spring-kafka does not block application
    # startup in its absence, the producer connection is lazy and publish
    # failures only surface/retry at send time (see AuthEventProducer).
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# Dev-only HMAC-SHA256 secret: never used outside this machine, protects
# nothing real. Never reuse this value in production (see auth-service-prod.yml,
# which requires ${JWT_SECRET} with no default).
jwt:
  secret: dev-only-jwt-secret-please-override-in-production-0123456789-auth-service
  expiration-ms: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.edgareldy.springmicroservicestutorial.authservice: DEBUG
