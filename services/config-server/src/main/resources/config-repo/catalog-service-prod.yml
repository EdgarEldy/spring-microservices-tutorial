# Prod profile: the "docker-compose up" scenario, against the standalone
# PostgreSQL container defined in docker-compose.yml (credentials injected as
# environment variables by that same docker-compose).
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

# Deliberately no default here: a prod deployment without JWT_SECRET set must
# fail at startup (see JwtService, @Value("${jwt.secret}") with no default)
# rather than start with a guessable secret. SAME environment variable name as
# auth-service-prod.yml (JWT_SECRET): both services must receive the same
# value for cross-service token validation to work.
jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: INFO
