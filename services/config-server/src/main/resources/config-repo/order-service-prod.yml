# Profil prod : scénario "docker-compose up" avec le conteneur PostgreSQL autonome
# défini dans docker-compose.yml (credentials injectés en variables d'environnement
# par ce même docker-compose).
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
  kafka:
    # "kafka" est le nom de service Docker Compose que feature/notification-service
    # ajoutera ; pas encore défini dans docker-compose.yml à ce stade du projet. La
    # valeur par défaut ci-dessous documente l'intention sans bloquer le démarrage
    # d'order-service tant que ce service n'existe pas (connexion producer lazy,
    # voir le commentaire équivalent dans order-service-dev.yml).
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.edgareldy.springmicroservicestutorial.orderservice.event
        spring.json.type.mapping: orderConfirmed:com.edgareldy.springmicroservicestutorial.orderservice.event.OrderConfirmedEvent,notificationFailed:com.edgareldy.springmicroservicestutorial.orderservice.event.NotificationFailedEvent

management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers

# Deliberately no default here: a prod deployment without JWT_SECRET set must fail
# at startup (see JwtService, @Value("${jwt.secret}") with no default) rather than
# start with a guessable secret. Must be the exact same value as auth-service's.
jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    root: INFO
