# Prod profile: prod values for auth-service (datasource, logging, actuator
# exposure) are centralized in config-server/config-repo/auth-service-prod.yml and
# fetched remotely via Spring Cloud Config at startup.
#
# This local file is deliberately left empty. It exists for structural
# consistency across every module in the reactor, and to hold, later, any
# override that must never go through config-server (e.g. a local secret the
# developer does not want to commit to config-repo).
