# Test profile: disables remote config import so auth-service's tests
# (unit/integration) never depend on a config-server actually running. Tests
# supply their own config (via @TestPropertySource, this file itself, or
# Testcontainers later).
spring:
  config:
    import: ""

# jwt.secret/jwt.expiration-ms are duplicated here on purpose. config-repo's
# auth-service-test.yml also defines them, but spring.config.import is blank
# above, so that remote file is never fetched by anything running with the
# "test" profile: this local file is the one that actually reaches the tests.
# JwtService requires both properties with no default (@Value("${jwt.secret}"),
# @Value("${jwt.expiration-ms}")), so without this block every test that loads
# a Spring context touching JwtService would fail at context startup.
jwt:
  secret: test-only-jwt-secret-not-for-any-real-use-0123456789-auth-service
  expiration-ms: 3600000
